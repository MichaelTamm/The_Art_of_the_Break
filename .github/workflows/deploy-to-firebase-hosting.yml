name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - trunk
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-to-firebase-hosting
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'MichaelTamm/The_Art_of_the_Break' && github.ref == 'refs/heads/trunk'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout trunk
        uses: actions/checkout@v7
        with:
          ref: trunk
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true
          pub-cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build web
        run: flutter build web

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: the-art-of-the-break
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: github-hosting-deployer@the-art-of-the-break.iam.gserviceaccount.com

      - name: Deploy to Firebase Hosting
        run: firebase deploy --only hosting --project the-art-of-the-break --non-interactive
