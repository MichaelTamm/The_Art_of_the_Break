name: the_art_of_the_break_widgetbook
publish_to: 'none'
version: 0.0.1

environment:
  flutter: 3.47.4
  sdk: 3.13.3

dependencies:
  auto_hyphenating_text: 0.3.2
  custom_text_engine: 0.1.5
  flutter:
    sdk: flutter
  flutter_hooks: 0.21.3+1
  flutter_hyphenation: 1.0.0
  google_fonts: 8.2.1
  hyphen: 0.4.0
  hyphenatorx: 1.5.11
  intl: 0.20.3
  syntax_highlight: 0.4.0
  soft_hyphen_text: 0.1.0
  widgetbook: 3.25.0
  widgetbook_annotation: 3.11.0

dev_dependencies:
  flutter_lints: 6.0.0
  flutter_test:
    sdk: flutter
  widgetbook_generator: 3.24.0
  build_runner: 2.16.1

flutter:
  uses-material-design: true
  fonts:
    - family: JetBrainsMono
      fonts:
        - asset: assets/JetBrainsMono-Regular.ttf
  assets:
    - assets/hyph-de-1996.dic
    - assets/hyph-de-1996.tex